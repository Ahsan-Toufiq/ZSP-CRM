databases:
  - name: digi7-zsp-postgres
    databaseName: digi7_zsp
    user: digi7_zsp
    region: singapore
    plan: basic_256mb

services:
  - type: web
    name: digi7-zsp-backend
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digi7-zsp-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,zsp-api.digi7.org
      - key: CORS_ALLOWED_ORIGINS
        value: https://digi7-zsp-frontend.onrender.com,https://zsp.digi7.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://digi7-zsp-frontend.onrender.com,https://zsp.digi7.org,https://zsp-api.digi7.org
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CSRF_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: CSRF_COOKIE_SAMESITE
        value: None
      - key: TIME_ZONE
        value: Asia/Karachi
      - key: LOGIN_THROTTLE_RATE
        value: 8/min

  - type: web
    name: digi7-zsp-frontend
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: BACKEND_API_ORIGIN
        value: https://digi7-zsp-backend.onrender.com
